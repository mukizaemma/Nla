# Nginx + PHP settings for admin image uploads (DigitalOcean / Linux)
# Include inside your site `server { ... }` block, then: sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 20M;

# Optional: longer timeouts for Livewire uploads
client_body_timeout 120s;

# PHP-FPM pool or php.ini (adjust path for your PHP version):
#   upload_max_filesize = 20M
#   post_max_size = 20M
#   memory_limit = 256M
#   max_execution_time = 120
#
# Also install GD (required for resize on Linux):
#   sudo apt update
#   sudo apt install -y php-gd php-imagick imagemagick
#   sudo phpenmod gd
#   sudo systemctl restart php8.3-fpm   # use your php-fpm service name
#
# Laravel storage must be writable:
#   cd /var/www/your-app
#   sudo chown -R www-data:www-data storage bootstrap/cache
#   php artisan storage:link
